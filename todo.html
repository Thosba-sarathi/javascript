    body{

    }
    #msg{
        padding:10px;
        width:300px;
    }
    #btn{
        border:1px solid black;
        padding:10px;

         background-color:chocolate;

<body>
    <h1 class="h1">TO-DO LIST</h1>
        <div class="menu">
        <input id="msg" placeholder="Type your To-do list"><br>
        <button  id="btn" onclick="updatetext()">Add</button>

        <ul>
            <li id="list-container">To Delete All
            <button id="clickit" onclick="deleteitem(event)">Click here</button><br>
            </li>
        </ul>
    </div>
</div>


</body>


 
<script>
    var message = document.getElementById("msg")

    var h = document.getElementById("list-container")
    
      

    function updatetext(){

        var listitem=document.createElement("li")

        listitem.innerHTML=message.value + "<button id='button2' onclick='deleteitem(event)'>Delete</button>"  + "<br>" + "<br>"

    

        h.append(listitem)
    }

    function deleteitem(){

        event.target.parentElement.remove()
        
    }

</script>
